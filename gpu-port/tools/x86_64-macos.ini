[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=15.0']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=15.0']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=15.0']
ar = 'ar'
strip = 'strip'
pkg-config = '/opt/homebrew/bin/pkg-config'
[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
[properties]
pkg_config_libdir = '$NULLMOTH_BUILD_ROOT/build/gpu-src/sysroot-x86/lib/pkgconfig'
